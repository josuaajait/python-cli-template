[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "python-cli-template"
version = "0.1.0"
description = "A Rich-powered Python CLI starter with readable terminal output and clean JSON pipelines"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Mikhael Josua Roganda"}]
dependencies = ["rich>=14.2,<16"]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
# Development only: linting, type checking and coverage. Not installed for end users.
dev = ["ruff>=0.8", "mypy>=1.13", "coverage>=7.10"]

[project.urls]
Repository = "https://github.com/josuaajait/python-cli-template"
Issues = "https://github.com/josuaajait/python-cli-template/issues"

[project.scripts]
python-cli = "cli_template.cli:main"

[tool.setuptools.packages.find]
include = ["cli_template*"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["build", ".tmp"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
lines-after-imports = 2

[tool.mypy]
python_version = "3.11"
files = ["cli_template", "scripts"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.coverage.run]
source = ["cli_template"]
branch = true
# Subprocess tests run the CLI in a child interpreter; `coverage combine` merges their data.
parallel = true
patch = ["subprocess"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
